name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a real credential is committed
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$|\.tokens/|client_secret.*\.json$'; then
            echo "::error::A secret file is tracked by git"; exit 1
          fi
          # google API keys start AIza; OAuth client ids end in .apps.googleusercontent.com
          if git grep -nIE 'AIza[0-9A-Za-z_-]{35}' -- . ; then
            echo "::error::Looks like a real Google API key is committed"; exit 1
          fi
          if git grep -nIE '[0-9]{10,}-[0-9a-z]{32}\.apps\.googleusercontent\.com' -- . ; then
            echo "::error::Looks like a real OAuth client id is committed"; exit 1
          fi
          echo "No credentials found in tracked files."
